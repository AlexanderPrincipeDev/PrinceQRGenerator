<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Prince QR Generator</title>
    <meta name="description" content="Gestiona tu perfil en Prince QR Generator.">

    <link rel="icon" type="image/x-icon" href="https://img.icons8.com/fluency/48/qr-code.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <header>
        <div class="container header-content">
            <div class="logo">
                <i class="fa-solid fa-qrcode"></i>
                <span>Prince QR</span>
            </div>
            <button class="mobile-menu-toggle" id="mobile-menu-toggle" aria-label="Toggle menu">
                <i class="fa-solid fa-bars"></i>
            </button>
            <nav id="main-nav">
                <a href="index.html">Generador</a>
                <a href="guide.html">Guía de Uso</a>
                <a href="faq.html">Preguntas Frecuentes</a>
                <a href="about.html">Acerca de</a>
                <a href="dashboard.html" id="nav-account" class="active">Mi Cuenta</a>
                <a href="login.html" id="nav-login">Login</a>
            </nav>
            <div class="header-actions">
                <a href="login.html" id="login-link" class="btn-auth">
                    <i class="fa-regular fa-user" aria-hidden="true"></i><span>Login</span>
                </a>
                <div class="auth-menu" id="auth-menu">
                    <button type="button" id="user-auth-btn" class="btn-auth" aria-expanded="false"
                        aria-haspopup="menu">
                        <i class="fa-solid fa-user-circle" aria-hidden="true"></i><span>Mi Cuenta</span>
                    </button>
                    <div id="user-auth-menu" class="auth-menu-panel" role="menu" aria-hidden="true">
                        <a href="dashboard.html" role="menuitem">Editar perfil</a>
                        <button type="button" id="logout-btn" role="menuitem">Cerrar sesión</button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="auth-page">
        <div class="container auth-container">
            <div class="auth-card auth-card--wide">
                <p id="loading" class="auth-subtitle">Verificando sesión...</p>

                <div id="content" class="hidden">
                    <img id="avatarImg" src="" class="avatar-preview" alt="Avatar" style="display: none;">
                    <h1 class="auth-title">Mi Perfil</h1>

                    <div class="input-group">
                        <label for="email">Correo</label>
                        <input type="text" id="email" disabled>
                    </div>

                    <div class="input-group">
                        <label for="displayName">Nombre</label>
                        <input type="text" id="displayName" placeholder="Tu nombre">
                    </div>

                    <div class="input-group">
                        <label for="phone">Teléfono</label>
                        <input type="tel" id="phone" placeholder="+51 999 999 999">
                    </div>

                    <div class="input-group">
                        <label for="avatarUrl">URL del Avatar</label>
                        <input type="url" id="avatarUrl" placeholder="https://ejemplo.com/foto.jpg">
                    </div>

                    <button id="saveBtn" class="btn btn-primary">Guardar Cambios</button>
                    <div id="msg" class="status-message" role="status" aria-live="polite"></div>

                    <button id="logoutBtn" class="btn btn-danger">Cerrar Sesión</button>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Prince QR Generator. Todos los derechos reservados.</p>
            <div class="dev-credit-badge"
                style="margin: 0.9rem auto 0; width: fit-content; display: inline-flex; align-items: center; gap: 0.6rem; padding: 0.55rem 1.1rem; border-radius: 999px; background: #f8fafc; color: #0f172a; font-size: 0.95rem; font-weight: 700; box-shadow: 0 4px 10px rgba(15, 23, 42, 0.1); border: 1px solid rgba(148, 163, 184, 0.35); text-align: center;">
                <span style="text-transform: uppercase; letter-spacing: 0.6px; font-size: 0.68rem; opacity: 0.7;">Web
                    creada por</span>
                <a href="https://prince-code-labs.vercel.app/" target="_blank" rel="noopener noreferrer"
                    style="color: #0f172a; text-decoration: none; font-weight: 800; border-bottom: 2px solid rgba(15, 23, 42, 0.35);">Prince
                    Code Labs</a>
            </div>
        </div>
    </footer>

    <!-- Supabase Logic -->
    <script type="module">
        import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

        const SUPABASE_URL = "https://wqhatywfpwioneziadle.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndxaGF0eXdmcHdpb25lemlhZGxlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg4MzE0NzAsImV4cCI6MjA4NDQwNzQ3MH0.e437EhncDLKPqLNRKJFh3-jvKB96-7iwXrBNOw0GvKk";

        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // UI Elements
        const loadingEl = document.getElementById('loading');
        const contentEl = document.getElementById('content');
        const emailInput = document.getElementById('email');
        const displayNameInput = document.getElementById('displayName');
        const phoneInput = document.getElementById('phone');
        const avatarUrlInput = document.getElementById('avatarUrl');
        const avatarImg = document.getElementById('avatarImg');
        const saveBtn = document.getElementById('saveBtn');
        const msgEl = document.getElementById('msg');
        let currentUser = null;

        function showMessage(text, type) {
            msgEl.textContent = text;
            msgEl.className = `status-message is-visible ${type}`;
        }

        async function init() {
            try {
                const { data: { session }, error } = await supabase.auth.getSession();
                if (error) throw error;

                if (!session) {
                    window.location.href = "login.html";
                    return;
                }

                currentUser = session.user;
                emailInput.value = currentUser.email;

                // Load Profile Data
                await loadProfile();

                loadingEl.classList.add('hidden');
                contentEl.classList.remove('hidden');

            } catch (err) {
                console.error("Auth Error:", err);
                window.location.href = "login.html";
            }
        }

        async function loadProfile() {
            try {
                const { data, error } = await supabase
                    .from('profiles')
                    .select('display_name, phone, avatar_url')
                    .eq('id', currentUser.id)
                    .single();

                if (error) {
                    return;
                }

                if (data) {
                    displayNameInput.value = data.display_name || '';
                    phoneInput.value = data.phone || '';
                    avatarUrlInput.value = data.avatar_url || '';
                    updateAvatarPreview(data.avatar_url);
                }
            } catch (error) {
                console.log("No profile found or error:", error);
            }
        }

        async function updateProfile() {
            try {
                saveBtn.disabled = true;
                saveBtn.textContent = "Guardando...";
                msgEl.className = 'status-message';

                const payload = {
                    id: currentUser.id,
                    display_name: displayNameInput.value,
                    phone: phoneInput.value,
                    avatar_url: avatarUrlInput.value
                };

                const { error } = await supabase
                    .from("profiles")
                    .upsert(payload, { onConflict: 'id' });

                if (error) {
                    showMessage(error.message, 'error');
                    return;
                }

                updateAvatarPreview(payload.avatar_url);
                showMessage("Datos actualizados correctamente.", 'success');

            } catch (error) {
                showMessage("Error inesperado: " + error.message, 'error');
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = "Guardar Cambios";
            }
        }

        function updateAvatarPreview(url) {
            if (url) {
                avatarImg.src = url;
                avatarImg.style.display = 'block';
            } else {
                avatarImg.style.display = 'none';
            }
        }

        saveBtn.addEventListener('click', updateProfile);
        avatarUrlInput.addEventListener('input', (e) => updateAvatarPreview(e.target.value));

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await supabase.auth.signOut();
            window.location.href = "login.html";
        });

        init();
    </script>
    <script type="module" src="auth.js"></script>
    <script src="site.js"></script>
</body>

</html>
