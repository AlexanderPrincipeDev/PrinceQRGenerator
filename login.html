<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Prince QR Generator</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f1f5f9;
            --surface: #ffffff;
            --text: #0f172a;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .login-card {
            background: var(--surface);
            padding: 2.5rem;
            border-radius: 1rem;
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h2 {
            margin-bottom: 0.5rem;
            color: var(--text);
        }

        p {
            color: #64748b;
            margin-bottom: 1.5rem;
        }

        .input-group {
            margin-bottom: 1rem;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text);
        }

        input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        button {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        #message {
            margin-top: 1.5rem;
            padding: 0.75rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            display: none;
        }

        .success {
            background-color: #dcfce7;
            color: #166534;
        }

        .error {
            background-color: #fee2e2;
            color: #991b1b;
        }
    </style>
</head>

<body>

    <div class="login-card">
        <h2>Bienvenido</h2>
        <p>Ingresa tu correo para recibir un enlace de acceso.</p>

        <div class="input-group">
            <label for="email">Correo Electrónico</label>
            <input type="email" id="email" placeholder="nombre@ejemplo.com" required>
        </div>

        <button id="sendBtn">Enviar Enlace Mágico</button>

        <div id="message"></div>
    </div>

    <!-- Initialization Script directly in HTML to avoid file:// CORS issues with local modules -->
    <script type="module">
        import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

        const SUPABASE_URL = "https://wqhatywfpwioneziadle.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndxaGF0eXdmcHdpb25lemlhZGxlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg4MzE0NzAsImV4cCI6MjA4NDQwNzQ3MH0.e437EhncDLKPqLNRKJFh3-jvKB96-7iwXrBNOw0GvKk";

        // Initialize client
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const emailInput = document.getElementById('email');
        const sendBtn = document.getElementById('sendBtn');
        const msgDiv = document.getElementById('message');

        function showMessage(text, type) {
            msgDiv.textContent = text;
            msgDiv.className = type; // 'success' or 'error'
            msgDiv.style.display = 'block';
        }

        sendBtn.addEventListener('click', async () => {
            const email = emailInput.value.trim();
            if (!email) {
                showMessage("Por favor ingresa un correo válido.", "error");
                return;
            }

            try {
                sendBtn.disabled = true;
                sendBtn.textContent = "Enviando...";
                msgDiv.style.display = 'none';

                // Construct the redirect URL manually to handle file:// protocols better if possible,
                // though file:// redirects are often blocked by email providers/browsers.
                // Best effort: relative path.
                // NOTE for USER: 'window.location.href' might result in 'file:///...' which acts weird in hrefs.
                // We use 'window.location.origin + path' typically.
                // Since this is likely local, we will try to just pass the filename, but Supabase expects a full URL.

                // Let's try to detect if we are on file protocol
                let redirectUrl = window.location.origin + "/dashboard.html";
                if (window.location.protocol === 'file:') {
                    // For local file testing, we might just have to accept that the redirect LINK in the email 
                    // won't automatically open the app if it points to localhost when the user is on file://
                    // But we can try pointing to the current file path structure.

                    // Ideally, the user needs a localhost. 
                    // I will stick to window.location.href approach but strip the current file and append dashboard.html
                    const currentPath = window.location.pathname;
                    const basePath = currentPath.substring(0, currentPath.lastIndexOf('/'));
                    // file:///Users/user/folder -> file:///Users/user/folder/dashboard.html
                    redirectUrl = window.location.protocol + "//" + basePath + "/dashboard.html";

                    console.log("Detected local file execution. Redirect URL set to:", redirectUrl);
                }

                const { error } = await supabase.auth.signInWithOtp({
                    email: email,
                    options: {
                        emailRedirectTo: redirectUrl,
                    },
                });

                if (error) throw error;

                showMessage("¡Enlace enviado! Revisa tu correo.", "success");

            } catch (error) {
                console.error(error);
                showMessage("Error: " + error.message, "error");
            } finally {
                sendBtn.disabled = false;
                sendBtn.textContent = "Enviar Enlace Mágico";
            }
        });
    </script>

</body>

</html>
